	<style>
		.swiper_btn{
			width: 2rem;
			height: auto;
			margin: 0;
			padding: 0;
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%,-50%);
			z-index: 3;
		}

		.swiper_btn_bg{
			z-index: 2;
		}

		.swiper_btn,
		.swiper_btn_bg {
			opacity: 1;
			transition: opacity 0.5s ease;
		}

		.swiper_btn.is-hidden,
		.swiper_btn_bg.is-hidden {
			opacity: 0;
		}

		/* ------------------------- */

		.swiper2 {
			width: 100%;
			height: 100%;
			margin: 0 auto;
			padding: 0;
			overflow: inherit;

			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%,-50%);

			z-index: 1;
		}

		.swiper2 .swiper-slide {
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.swiper2 .swiper-slide img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}
	</style>
	<script src="js/base.js?●15"></script>
	<script>
		const swiper2 = new Swiper('.swiper2', {
			loop: true,
			effect: 'fade',
			fadeEffect: {
				crossFade: true,
			},
			slidesPerView: 1,
			speed: 1000,
			autoplay: {
				delay: 100,
				disableOnInteraction: false,
			},
			allowTouchMove: false,
		});

		const swiperBtn = document.querySelector('.swiper_btn');
		const swiperBtnBg = document.querySelector('.swiper_btn_bg');

		swiperBtn.addEventListener('click', function () {

			// 非表示
			swiperBtn.classList.add('is-hidden');
			swiperBtnBg.classList.add('is-hidden');

			// 3秒後に表示
			setTimeout(() => {

				swiperBtn.classList.remove('is-hidden');
				swiperBtnBg.classList.remove('is-hidden');

			}, 3000);

		});
	</script>
